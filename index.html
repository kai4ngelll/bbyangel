<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер · Jeremy Scott Gorilla</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #dce3ef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .tracker-card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px 48px 32px 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 24px 48px rgba(0, 20, 40, 0.2), 0 8px 16px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1a2a4a, #2b4a7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 i {
            color: #2b4a7a;
            font-size: 1.8rem;
            background: rgba(43, 74, 122, 0.12);
            padding: 6px 10px;
            border-radius: 60px;
        }

        .price-tag {
            background: #1e2f4a;
            color: white;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price-tag i {
            color: #ffd966;
        }

        .product-badge {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 60px;
            padding: 8px 18px 8px 14px;
            margin-bottom: 22px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            gap: 6px;
        }

        .product-badge .product-name {
            font-weight: 700;
            color: #0f1f33;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .product-badge .product-name i {
            color: #b22234;
        }

        .product-badge .eta {
            background: #1a2a44;
            color: white;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .map-placeholder {
            background: #d9e2ef;
            border-radius: 32px;
            padding: 18px 12px 12px;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.02), 0 8px 16px rgba(0,20,40,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .route-line {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 6px 4px;
        }

        .city {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a2a44;
            gap: 4px;
        }

        .city i {
            font-size: 1.4rem;
            background: white;
            padding: 6px;
            border-radius: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .city small {
            font-weight: 400;
            font-size: 0.6rem;
            opacity: 0.7;
        }

        .progress-track {
            flex: 1;
            height: 6px;
            background: rgba(0,0,0,0.06);
            border-radius: 20px;
            margin: 0 8px;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b7bc9, #1f4f8a);
            border-radius: 20px;
            transition: width 0.3s ease;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
        }

        .moving-marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.7rem;
            color: #c0392b;
            filter: drop-shadow(0 2px 8px rgba(192, 57, 43, 0.35));
            transition: left 0.3s ease;
            left: 0%;
            z-index: 3;
            white-space: nowrap;
        }

        .truck-info {
            display: flex;
            justify-content: center;
            gap: 18px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 6px 16px;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #1f2f4a;
            border: 1px solid rgba(255,255,255,0.4);
            flex-wrap: wrap;
        }

        .truck-info i {
            color: #2b4a7a;
            margin-right: 4px;
        }

        .truck-info span {
            font-weight: 500;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0 18px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .info-item i {
            font-size: 1.2rem;
            color: #1f4f8a;
            width: 28px;
            text-align: center;
        }

        .info-item div {
            display: flex;
            flex-direction: column;
        }

        .info-item .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3a4d6b;
            font-weight: 700;
        }

        .info-item .value {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0f1f33;
        }

        .status-bar {
            background: #0f1f33;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
            box-shadow: 0 6px 14px rgba(0, 20, 30, 0.2);
            gap: 6px;
        }

        .status-bar .status-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-bar .status-text i {
            color: #5fc3e4;
            animation: pulse 1.8s infinite;
        }

        .status-bar .date-badge {
            background: rgba(255,255,255,0.12);
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }

        .footer-note {
            margin-top: 18px;
            font-size: 0.7rem;
            color: #3c5370;
            text-align: center;
            opacity: 0.8;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-note i {
            margin-right: 4px;
            color: #2b4a7a;
        }

        @media (max-width: 480px) {
            .tracker-card { padding: 20px 14px; }
            .header h1 { font-size: 1.3rem; }
            .price-tag { font-size: 0.75rem; padding: 4px 12px; }
            .info-panel { grid-template-columns: 1fr; }
            .product-badge .product-name { font-size: 0.85rem; }
            .truck-info { font-size: 0.6rem; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="tracker-card" id="app">

    <!-- Header -->
    <div class="header">
        <h1>
            <i class="fas fa-shipping-fast"></i> Трекер
        </h1>
        <div class="price-tag">
            <i class="fas fa-tag"></i> ¥70 · ₽2800
        </div>
    </div>

    <!-- Product -->
    <div class="product-badge">
        <span class="product-name">
            <i class="fas fa-paw"></i> Jeremy Scott Gorilla
        </span>
        <span class="eta"><i class="fas fa-calendar-alt"></i> 16 сент.</span>
    </div>

    <!-- Map / Route -->
    <div class="map-placeholder">
        <div class="route-line">
            <div class="city">
                <i class="fas fa-city"></i>
                <span>Гуанчжоу</span>
                <small>Китай</small>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                <div class="moving-marker" id="movingMarker" style="left: 0%;">
                    <i class="fas fa-truck"></i>
                </div>
            </div>
            <div class="city">
                <i class="fas fa-flag-checkered"></i>
                <span>Москва</span>
                <small>Россия</small>
            </div>
        </div>

        <!-- Truck details -->
        <div class="truck-info">
            <span><i class="fas fa-truck"></i> Фура «Белый тигр»</span>
            <span><i class="fas fa-id-card"></i> А 789 КН 116</span>
            <span><i class="fas fa-flag"></i> КНР · РФ</span>
        </div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">
        <div class="info-item">
            <i class="fas fa-map-pin"></i>
            <div>
                <span class="label">Текущая позиция</span>
                <span class="value" id="currentLocation">Гуанчжоу · отправление</span>
            </div>
        </div>
        <div class="info-item">
            <i class="fas fa-clock"></i>
            <div>
                <span class="label">МСК · время</span>
                <span class="value" id="currentTime">--:--</span>
            </div>
        </div>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-text">
            <i class="fas fa-circle"></i>
            <span id="statusMessage">Отправлено из Гуанчжоу</span>
        </div>
        <div class="date-badge" id="dateBadge">
            <i class="far fa-calendar"></i> 4 сент.
        </div>
    </div>

    <div class="footer-note">
        <span><i class="fas fa-route"></i> 12 дней в пути</span>
        <span><i class="fas fa-clock"></i> обновление каждые 2с</span>
        <span><i class="fas fa-gorilla"></i> Jeremy Scott</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // --- ДАТЫ: отправление 4 сентября 9:30, прибытие 16 сентября ---
        const START_DATE = new Date(2026, 8, 4, 9, 30, 0);
        const ARRIVAL_DATE = new Date(2026, 8, 16, 23, 59, 59);
        const PICKUP_DATE = new Date(2026, 8, 17, 20, 0, 0);

        // --- 15 ЭТАПОВ ---
        const STAGES = [
            { name: 'Гуанчжоу · отправление', status: 'Груз оформлен, выезд из Гуанчжоу', progress: 0, hours: 0 },
            { name: 'Гуанчжоу · трасса G4', status: 'Движется по трассе G4', progress: 4, hours: 2.5 },
            { name: 'Шаогуань · транзит', status: 'Проезжает Шаогуань', progress: 8, hours: 5.5 },
            { name: 'Чэньчжоу · транзит', status: 'Проезжает Чэньчжоу', progress: 13, hours: 8.5 },
            { name: 'Ухань · транзит', status: 'Проезжает Ухань', progress: 18, hours: 11.5 },
            { name: 'Сяогань · транзит', status: 'Проезжает Сяогань', progress: 24, hours: 15 },
            { name: 'Суйчжоу · транзит', status: 'Проезжает Суйчжоу', progress: 30, hours: 18.5 },
            { name: 'Чунцин · транзит', status: 'Приближается к Чунцину', progress: 38, hours: 22.5 },
            { name: 'Чунцин · граница', status: 'Выезд из Чунцина к границе', progress: 46, hours: 27 },
            { name: 'Граница КНР/Казахстан', status: 'Пересекает границу с Казахстаном', progress: 54, hours: 33 },
            { name: 'Казахстан · транзит', status: 'Пересекает Казахстан', progress: 64, hours: 42 },
            { name: 'Граница Казахстан/РФ', status: 'Въезд в Россию', progress: 74, hours: 52 },
            { name: 'Россия · Урал', status: 'Движется через Урал', progress: 84, hours: 64 },
            { name: 'Московская область', status: 'Въезд в Московскую область', progress: 94, hours: 78 },
            { name: 'Москва · МКАД', status: 'Прибыл в Москву, сортировка', progress: 100, hours: 92 },
        ];

        // --- элементы DOM ---
        const progressFill = document.getElementById('progressFill');
        const movingMarker = document.getElementById('movingMarker');
        const currentLocation = document.getElementById('currentLocation');
        const currentTime = document.getElementById('currentTime');
        const statusMessage = document.getElementById('statusMessage');
        const dateBadge = document.getElementById('dateBadge');

        function getMoscowNow() {
            const now = new Date();
            const mskOffset = 180;
            const localOffset = now.getTimezoneOffset();
            return new Date(now.getTime() + (mskOffset + localOffset) * 60000);
        }

        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function hoursDiff(date1, date2) {
            return (date1.getTime() - date2.getTime()) / (1000 * 60 * 60);
        }

        function getCurrentStage(nowMsk) {
            const hoursFromStart = hoursDiff(nowMsk, START_DATE);

            if (hoursFromStart < 0) {
                return { stage: STAGES[0], progress: 0 };
            }

            if (nowMsk >= ARRIVAL_DATE) {
                if (nowMsk >= PICKUP_DATE) {
                    return {
                        stage: { name: 'Москва · получен', status: '🎉 Получен получателем 17 сентября', progress: 105 },
                        progress: 105
                    };
                }
                const waitProgress = Math.min(100, ((nowMsk - ARRIVAL_DATE) / (PICKUP_DATE - ARRIVAL_DATE)) * 100);
                return {
                    stage: { name: 'Москва · ожидает получения', status: '📦 Готов к выдаче', progress: 100 + waitProgress * 0.05 },
                    progress: 100 + waitProgress * 0.05
                };
            }

            let currentStage = STAGES[0];
            let nextStage = STAGES[1] || null;

            for (let i = 0; i < STAGES.length; i++) {
                if (hoursFromStart >= STAGES[i].hours) {
                    currentStage = STAGES[i];
                    nextStage = STAGES[i + 1] || null;
                }
            }

            let progress = currentStage.progress;
            if (nextStage) {
                const duration = nextStage.hours - currentStage.hours;
                const elapsed = hoursFromStart - currentStage.hours;
                const stageProgress = Math.min(1, Math.max(0, elapsed / duration));
                progress = currentStage.progress + (nextStage.progress - currentStage.progress) * stageProgress;
            }

            return { stage: currentStage, progress: Math.min(105, progress) };
        }

        function updateTracker() {
            const nowMsk = getMoscowNow();
            const { stage, progress } = getCurrentStage(nowMsk);

            const percent = Math.min(105, Math.round(progress));
            progressFill.style.width = Math.min(100, percent) + '%';
            movingMarker.style.left = Math.min(100, percent) + '%';

            currentLocation.textContent = stage.name;
            statusMessage.textContent = stage.status;
            currentTime.textContent = formatTime(nowMsk);

            const dateStr = formatDate(nowMsk);
            dateBadge.innerHTML = `<i class="far fa-calendar"></i> ${dateStr}`;

            if (progress >= 105) {
                movingMarker.innerHTML = '<i class="fas fa-check-circle" style="color:#27ae60;"></i>';
            } else if (progress >= 100) {
                movingMarker.innerHTML = '<i class="fas fa-box" style="color:#f39c12;"></i>';
            } else {
                movingMarker.innerHTML = '<i class="fas fa-truck"></i>';
            }
        }

        updateTracker();
        setInterval(updateTracker, 2000);

        document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTracker(); });
        window.addEventListener('load', updateTracker);
        window.addEventListener('resize', updateTracker);

        console.log('Трекер Jeremy Scott Gorilla (отправление 4 сентября 9:30, прибытие 16 сентября)');
        console.log('Текущее время МСК:', getMoscowNow().toLocaleString('ru-RU'));
        console.log('Часов от старта:', hoursDiff(getMoscowNow(), START_DATE).toFixed(1));
    })();
</script>
</body>
</html>
